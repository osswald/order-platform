name: Play review deploy

on:
  workflow_run:
    workflows: [Pi Docker images]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Play review workflow guards
        run: ./scripts/test-play-review-workflow-guards.sh

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PLAY_REVIEW_DEPLOY_HOST }}
          username: ${{ secrets.PLAY_REVIEW_DEPLOY_USER }}
          key: ${{ secrets.PLAY_REVIEW_DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.PLAY_REVIEW_DEPLOY_PATH }}"
            # Plain fetch: older VPS git has no fetch --ff-only; merge enforces FF.
            git fetch origin main
            # Discard local tracked edits that would block merge (deploy checkout).
            git reset --hard HEAD
            # Remove untracked bootstrap copies that block merge; ignored
            # files such as cloud/play-review/.env are kept.
            # Keep hosted Caddy snippets (play-review TLS route).
            git clean -fd -e cloud/hosted-snippets
            git merge --ff-only origin/main
            # When dispatched from a fix branch, use that commit's deploy scripts.
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.sha }}" != "$(git rev-parse HEAD)" ]]; then
              git fetch origin "${{ github.sha }}"
              git checkout "${{ github.sha }}" -- \
                scripts/deploy-play-review.sh \
                scripts/ensure-play-review-caddy.sh \
                scripts/cleanup-play-review.sh \
                cloud/hosted-snippets/play-review.caddy
            fi
            ./scripts/deploy-play-review.sh
