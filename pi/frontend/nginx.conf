server {
    listen 80;
    server_name _;

    # Docker embedded DNS. Variable proxy_pass defers upstream resolution so
    # nginx can start without pi-backend (OTA pre-apply probe runs FE alone).
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location /health {
        set $backend "pi-backend:8000";
        # $request_uri required: with a variable, a fixed path in proxy_pass
        # replaces the whole client URI (so /v1/sync/pull would become /v1/).
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        set $backend "pi-backend:8000";
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
