version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      root-npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      website:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /cloud/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # typescript-eslint peers still require typescript <6.1; ignore TS 7 majors until that catches up
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      cloud-frontend:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /pi/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # typescript-eslint peers still require typescript <6.1; ignore TS 7 majors until that catches up
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      pi-frontend:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /cloud/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloud-backend:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /pi/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pi-backend:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /cloud/hosted-pi-manager
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      hosted-pi-manager:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
